issues:
  - severity: medium
    category: code
    description: >
      `hexToRgb` (app/components/Grainient.tsx) só aceita #RRGGBB. O minificador do
      build encurta cores (`--color-surface:#fff` no CSS de produção). Cobalto e âmbar
      não têm forma curta, então hoje funciona, mas qualquer token futuro que encurte
      vira branco [1,1,1] em silêncio no gradiente.
    recommendation: "Aceitar #RGB (expandir para #RRGGBB) e cobrir com um caso no teste de hexToRgb."
  - severity: medium
    category: code
    description: >
      Rótulo do link da marca no header é `aria-label="LamiTrack, início"`, mas o texto
      visível é "LAMIT Track". Viola WCAG 2.5.3 (Label in Name): quem usa comando de voz
      e diz "LAMIT Track" não é atendido. A loja segue o padrão certo ("Lamit Store — início").
    recommendation: "Trocar para `aria-label=\"LAMIT Track, início\"` e ajustar o SiteHeader.test.tsx."
  - severity: low
    category: requirements
    description: >
      AC 5 pede o grep "sem diferenciar maiúsculas", o que casa `Inter` com `pointer`
      (4 falsos positivos confirmados). O @dev seguiu o grep do CLAUDE.md (diferenciando).
    recommendation: "@po corrigir a redação do AC 5 para \"diferenciando maiúsculas, como no CLAUDE.md\"."
  - severity: low
    category: code
    description: "EventCard agenda requestAnimationFrame no tilt e não cancela no unmount."
    recommendation: "useEffect de limpeza com cancelAnimationFrame(frameRef.current). Sem efeito visível hoje."
  - severity: low
    category: code
    description: >
      `$focus-ring-color` laranja faz o Bootstrap desenhar anel em box-shadow em
      .form-control/.btn do Bootstrap. A regra da marca é sem sombra em campo e foco
      por outline. Ainda não há campos.
    recommendation: "Quando os primeiros formulários chegarem, zerar $input-btn-focus-box-shadow / $focus-ring-width e confiar no outline global."
  - severity: low
    category: performance
    description: "CSS raiz com 233 kB (33 kB gzip) por importar o Bootstrap inteiro (já registrado na 5.24)."
    recommendation: "Importar só os módulos usados, na #6."
  - severity: low
    category: security
    description: "npm audit: 21 vulnerabilidades (5 high) em vite, zod e dependências de dev, anteriores a esta story. O ogl não tem dependências."
    recommendation: "@devops avaliar `npm audit fix` numa story própria."

