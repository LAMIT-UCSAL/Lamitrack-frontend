<article class="eve-card eve-card-hover h-100 d-flex flex-column overflow-hidden" [routerLink]="['/eventos', evento.id]" style="cursor: pointer;">
  <div class="position-relative" style="height: 160px; overflow: hidden;">
    <img [src]="evento.imagemUrl" [alt]="evento.titulo" class="w-100 h-100" style="object-fit: cover; object-position: top;">
    <div class="position-absolute top-0 start-0 m-3">
      <span [class]="evento.categoria | categoriaBadgeClass">{{ evento.categoria }}</span>
    </div>
    <div class="position-absolute top-0 end-0 m-3">
      <span *ngIf="evento.precoIngresso === 0" class="badge-free">Gratuito</span>
      <span *ngIf="evento.precoIngresso > 0" class="badge-paid">R$ {{ evento.precoIngresso | number:'1.2-2' }}</span>
    </div>
  </div>

  <div class="d-flex flex-column flex-grow-1 p-3 gap-2">
    <h3 class="h6 fw-semibold mb-0 text-eve-navy">{{ evento.titulo }}</h3>

    <div class="d-flex flex-column gap-1 small text-eve-secondary">
      <span>{{ evento.dataFormatada }}</span>
      <span class="text-truncate">{{ evento.local }}</span>
      <span>{{ evento.inscritos }} inscritos</span>
    </div>

    <div class="mt-auto pt-1">
      <button type="button" class="btn btn-eve-outline btn-sm w-100">Ver detalhes</button>
    </div>
  </div>
</article>
