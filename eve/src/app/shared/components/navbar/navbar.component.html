<header class="navbar-eve-fixed">
  <div class="container-xxl h-100 d-flex align-items-center justify-content-between px-3 px-md-4" style="max-width: 1152px;">
    <a routerLink="/" (click)="closeMobile()" class="text-decoration-none d-flex align-items-center">
      <img src="assets/img/logo-eve.svg" alt="EVE" class="navbar-logo">
    </a>

    <nav class="d-none d-md-flex align-items-center gap-4">
      <a routerLink="/eventos" routerLinkActive="text-eve-azul" class="text-decoration-none small fw-medium text-eve-secondary">Eventos</a>
      <a routerLink="/comunidade" routerLinkActive="text-eve-azul" class="text-decoration-none small fw-medium text-eve-secondary">Comunidades</a>
      <a routerLink="/feed" routerLinkActive="text-eve-azul" class="text-decoration-none small fw-medium text-eve-secondary">Feed</a>
      <a routerLink="/institucional/privacidade" routerLinkActive="text-eve-azul" class="text-decoration-none small fw-medium text-eve-secondary">Sobre</a>
    </nav>

    <div class="d-none d-md-flex align-items-center gap-3">
      <a *ngIf="!usuario || usuario.tipo === 'organizador'" routerLink="/organizador/dashboard" class="text-decoration-none small fw-medium text-eve-secondary">Painel</a>
      <ng-container *ngIf="usuario; else entrarDesktop">
        <span class="small fw-medium text-eve-navy">{{ usuario.nome }} <span class="text-eve-secondary">· {{ usuario.tipo === 'organizador' ? 'Organizador' : 'Participante' }}</span></span>
        <button type="button" class="btn btn-eve-outline btn-sm px-3 py-1" (click)="sair()">Sair</button>
      </ng-container>
      <ng-template #entrarDesktop>
        <a routerLink="/entrar" class="btn btn-eve-outline btn-sm px-3 py-1">Entrar</a>
      </ng-template>
    </div>

    <button type="button" class="btn navbar-hamburger d-md-none p-1 text-eve-navy" (click)="toggleMobile()" aria-label="Abrir menu">
      <span style="font-size: 2rem;" *ngIf="!mobileOpen">&#9776;</span>
      <span style="font-size: 2rem;" *ngIf="mobileOpen">&times;</span>
    </button>
  </div>

  <div *ngIf="mobileOpen" class="d-md-none border-top px-3 py-3 d-flex flex-column gap-3" style="background-color: var(--eve-cream); border-color: var(--eve-cinza-borda);">
    <a routerLink="/eventos" (click)="closeMobile()" class="text-decoration-none small fw-medium text-eve-secondary">Eventos</a>
    <a routerLink="/comunidade" (click)="closeMobile()" class="text-decoration-none small fw-medium text-eve-secondary">Comunidades</a>
    <a routerLink="/feed" (click)="closeMobile()" class="text-decoration-none small fw-medium text-eve-secondary">Feed</a>
    <a routerLink="/institucional/privacidade" (click)="closeMobile()" class="text-decoration-none small fw-medium text-eve-secondary">Sobre</a>
    <a *ngIf="!usuario || usuario.tipo === 'organizador'" routerLink="/organizador/dashboard" (click)="closeMobile()" class="text-decoration-none small fw-medium text-eve-secondary">Painel do organizador</a>
    <ng-container *ngIf="usuario; else entrarMobile">
      <span class="small fw-medium text-eve-navy">{{ usuario.nome }} <span class="text-eve-secondary">· {{ usuario.tipo === 'organizador' ? 'Organizador' : 'Participante' }}</span></span>
      <button type="button" class="btn btn-eve-outline btn-sm align-self-start px-3 py-1" (click)="sair()">Sair</button>
    </ng-container>
    <ng-template #entrarMobile>
      <a routerLink="/entrar" (click)="closeMobile()" class="btn btn-eve-outline btn-sm align-self-start px-3 py-1">Entrar</a>
    </ng-template>
  </div>
</header>
