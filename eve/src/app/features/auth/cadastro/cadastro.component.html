<div class="page-offset d-flex justify-content-center" style="min-height: 100vh;">
  <div class="container-xxl px-3 px-md-4 py-4" style="max-width: 480px;">
    <div class="eve-card p-4" style="margin-top: 48px;">
      <h1 class="fs-4 fw-bold text-eve-navy mb-1">Criar conta na EVE</h1>
      <p class="small text-eve-secondary mb-4">Leva menos de um minuto.</p>

      <div class="small p-2 rounded-eve-lg mb-3" style="background-color: #E6F1FB; color: #0C447C;" *ngIf="sugeridoParaCriarEventos">
        Pra criar e publicar seus próprios eventos, cadastre-se como organizador.
      </div>

      <form [formGroup]="form" (ngSubmit)="cadastrar()" class="d-flex flex-column gap-3">
        <div>
          <label class="form-label small fw-medium text-eve-navy d-block mb-2">Quero me cadastrar como</label>
          <div class="d-flex gap-2">
            <button
              type="button"
              class="pill-filter flex-grow-1"
              [class.active]="tipo?.value === 'participante'"
              (click)="selecionarTipo('participante')">Participante</button>
            <button
              type="button"
              class="pill-filter flex-grow-1"
              [class.active]="tipo?.value === 'organizador'"
              (click)="selecionarTipo('organizador')">Organizador</button>
          </div>
        </div>

        <div>
          <label class="form-label small fw-medium text-eve-navy">Nome completo</label>
          <input type="text" class="form-control" placeholder="Seu nome" formControlName="nome">
          <div class="small mt-1" style="color: var(--eve-vermelho);" *ngIf="nome?.invalid && nome?.touched">Nome é obrigatório.</div>
        </div>

        <div>
          <label class="form-label small fw-medium text-eve-navy">E-mail</label>
          <input type="email" class="form-control" placeholder="seu@email.com" formControlName="email">
          <div class="small mt-1" style="color: var(--eve-vermelho);" *ngIf="email?.invalid && email?.touched">E-mail inválido.</div>
        </div>

        <div>
          <label class="form-label small fw-medium text-eve-navy">Senha</label>
          <input type="password" class="form-control" placeholder="Mínimo 6 caracteres" formControlName="senha">
          <div class="small mt-1" style="color: var(--eve-vermelho);" *ngIf="senha?.invalid && senha?.touched">Senha precisa de pelo menos 6 caracteres.</div>
        </div>

        <div class="small p-2 rounded-eve-lg" style="background-color: #FCE4E4; color: var(--eve-vermelho);" *ngIf="emailDuplicado">
          Este e-mail já está cadastrado. <a routerLink="/entrar" class="text-eve-vermelho fw-medium">Faça login</a>.
        </div>

        <button type="submit" class="btn btn-eve-primary w-100 py-2">Criar conta</button>
      </form>

      <p class="small text-eve-secondary text-center mt-4 mb-0">
        Já tem conta?
        <a [routerLink]="'/entrar'" [queryParams]="redirectTo ? { redirectTo } : {}" class="text-eve-azul text-decoration-none fw-medium">Entrar</a>
      </p>

      <a routerLink="/" class="d-block text-center small text-eve-azul text-decoration-none mt-3">← Voltar para o início</a>
    </div>
  </div>
</div>
