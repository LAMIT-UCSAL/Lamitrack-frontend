<div class="page-offset" *ngIf="evento">
  <div class="container-xxl px-3 px-md-4 py-4" style="max-width: 900px;">

    <a routerLink="/organizador/dashboard" class="d-inline-flex align-items-center gap-2 small fw-medium text-eve-secondary text-decoration-none mb-3">
      ← Voltar ao painel
    </a>

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
      <div>
        <h1 class="fs-3 fw-bold text-eve-navy mb-1">Check-in · {{ evento.titulo }}</h1>
        <p class="small text-eve-secondary mb-0">{{ checados.size }} de {{ participantes.length }} participantes presentes</p>
      </div>
      <div class="d-flex align-items-center gap-2 small fw-medium px-3 py-2 rounded-eve-full" style="background-color: #E6F1FB; color: #0C447C;">
        {{ percentualPresenca }}% de presença
      </div>
    </div>

    <div class="eve-card overflow-hidden">
      <div class="d-flex justify-content-between px-4 py-3 border-bottom small fw-semibold text-eve-secondary" style="background-color: var(--eve-cream); border-color: var(--eve-cinza-borda) !important;">
        <span>Participante</span>
        <span>Check-in</span>
      </div>

      <div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom" style="border-color: var(--eve-cinza-borda) !important;" *ngFor="let p of participantes; let last = last" [class.border-0]="last">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-semibold flex-shrink-0" [style.background-color]="p.cor" style="width: 36px; height: 36px; font-size: 0.75rem;">{{ p.iniciais }}</div>
          <div>
            <p class="small fw-semibold text-eve-navy mb-0">{{ p.nome }}</p>
            <p class="small text-eve-secondary mb-0">{{ p.area }}</p>
          </div>
        </div>

        <button
          type="button"
          class="eve-switch"
          [style.background-color]="checados.has(p.id) ? 'var(--eve-azul)' : 'var(--eve-cinza-borda)'"
          (click)="toggle(p.id)"
          role="switch"
          [attr.aria-checked]="checados.has(p.id)">
          <span class="eve-switch-thumb" [style.transform]="checados.has(p.id) ? 'translateX(20px)' : 'translateX(0)'"></span>
        </button>
      </div>
    </div>

  </div>
</div>
